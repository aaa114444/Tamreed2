
# Build and deploy Tamreed2 API to Azure App Service

name: Build and deploy ASP.NET Core API to Azure Web App - tamreed2-api-2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build Tamreed2 API
        run: dotnet build src/Tamreed2.Api/Tamreed2.Api.csproj --configuration Release

      - name: Publish Tamreed2 API
        run: dotnet publish src/Tamreed2.Api/Tamreed2.Api.csproj --configuration Release --no-build --output ./publish

      - name: Verify published files
        run: |
          echo "Published API files:"
          ls -la ./publish
          echo "Checking API runtime files..."
          test -f ./publish/Tamreed2.Api.dll
          test -f ./publish/Tamreed2.Api.runtimeconfig.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamreed2-api
          path: ./publish/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: tamreed2-api
          path: ./publish

      - name: Verify deployment files
        run: |
          ls -la ./publish
          test -f ./publish/Tamreed2.Api.dll
          test -f ./publish/Tamreed2.Api.runtimeconfig.json

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0371F2FD2DF5416B861A608A4886215B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F20BE71863154462A96A1B6FF2C06E89 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_34307E49CA1847EFAAE18A44B4F1BF4E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: tamreed2-api-2026
          slot-name: Production
          package: ./publish
